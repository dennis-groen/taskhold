services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskhold
      POSTGRES_PASSWORD: taskhold
      POSTGRES_DB: taskhold
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<version>
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhold -d taskhold"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
