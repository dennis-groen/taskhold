# Runs the same checks as `pnpm check` and `pnpm test` on every pull request and on main, builds
# the Docker image, then deploys main to production through Coolify once all three pass.
# Coolify's own auto-deploy is off, so a red build never ships. Actions are pinned to commit SHAs
# (tag in the comment).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its previous run; runs on main always finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # A *.table.ts change without its migration would reach production unmigrated.
      # drizzle-kit generate doesn't connect; it only needs DATABASE_URL to be set.
      - name: Migrations match the tables
        env:
          DATABASE_URL: postgres://unused@localhost/unused
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "::error::A *.table.ts changed without a migration. Run pnpm db:generate and commit apps/api/drizzle."
            git status --porcelain apps/api/drizzle
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: taskhold
          POSTGRES_PASSWORD: taskhold
          POSTGRES_DB: taskhold
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskhold -d taskhold"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The API tests create, migrate and empty this database themselves
      TEST_DATABASE_URL: postgres://taskhold:taskhold@localhost:5432/taskhold_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Dockerfile is its own build: its COPY list and pnpm deploy aren't run by the other
      # jobs, and Coolify would only find a mistake in them after the merge
      - run: docker build -t taskhold:ci .

  deploy:
    name: Deploy to production
    needs: [check, test, image]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'dennis-groen/taskhold'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time; a newer one waits instead of cancelling a deploy halfway
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Repository secrets: the app's deploy webhook URL from Coolify (Webhooks tab), and an API
      # token with the Deploy and Read permissions. See docs/operations.md, "Deploying".
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      # Coolify builds the head of main, not this exact commit. If main moved on while CI ran,
      # deploying now would ship commits whose CI hasn't passed; their own run deploys them instead.
      - name: Check this commit is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved on to $head; that commit's run will deploy it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy and wait for Coolify
        if: steps.head.outputs.current == 'true'
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::Set the COOLIFY_WEBHOOK and COOLIFY_TOKEN repository secrets."
            exit 1
          fi
          # The token travels in a header, so never over plain HTTP
          if [[ "$COOLIFY_WEBHOOK" != https://* ]]; then
            echo "::error::COOLIFY_WEBHOOK must be an https:// URL."
            exit 1
          fi
          auth="Authorization: Bearer $COOLIFY_TOKEN"

          if ! response=$(curl --silent --show-error --fail-with-body --max-time 30 \
            --request POST --header "$auth" "$COOLIFY_WEBHOOK"); then
            echo "::error::Coolify rejected the deploy request: $response"
            exit 1
          fi
          deployment=$(jq -r '.deployments[0].deployment_uuid // empty' <<< "$response" 2>/dev/null || true)
          if [ -z "$deployment" ]; then
            echo "::error::Coolify didn't queue a deployment: $response"
            exit 1
          fi
          echo "Coolify deployment $deployment queued"

          # Fails the job when the build fails or the container never becomes healthy (for
          # example a migration that errors on start), so main shows red in GitHub too.
          api="${COOLIFY_WEBHOOK%%/api/v1/*}/api/v1"
          for _ in $(seq 1 100); do
            sleep 15
            status=$(curl --silent --show-error --fail --max-time 30 --header "$auth" \
              "$api/deployments/$deployment" | jq -r .status) || status="unknown"
            echo "Status: $status"
            case "$status" in
              finished) exit 0 ;;
              failed | cancelled*)
                echo "::error::Coolify deployment $deployment ended as $status. Its logs are in Coolify."
                exit 1
                ;;
            esac
          done
          echo "::error::Coolify deployment $deployment didn't finish within 25 minutes."
          exit 1
