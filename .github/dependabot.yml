# The Docker base image and the GitHub Actions are pinned (by digest and by commit SHA), so
# someone has to propose the next ones. npm dependencies are updated by hand; Dependabot's
# security updates still cover them.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
